_format_version: '3.0'
services:
- write_timeout: 60000
  tags:
  - AAA
  connect_timeout: 60000
  read_timeout: 60000
  enabled: true
  retries: 5
  protocol: http
  name: aaa-big-data-api
  port: 80
  host: aaa-bigdata-api.tst-ms.svc.cluster.local
  path: /
  routes:
  - response_buffering: true
    tags:
    - AAA
    paths:
    - /fbb/v1/usage
    methods:
    - GET
    path_handling: v0
    hosts:
    - api.tst.cz.oss-apigw.vodafone.com
    preserve_host: false
    name: aaa-big-data-api-usage
    strip_path: true
    protocols:
    - https
    regex_priority: 0
    https_redirect_status_code: 426
    request_buffering: true
    plugins:
    - enabled: true
      instance_name: aaa-big-data-api-usage-key-auth
      name: key-auth
      config:
        realm: null
        identity_realms:
        - scope: cp
          region: null
        key_names:
        - Api-Key
        run_on_preflight: true
        anonymous: null
        key_in_body: false
        hide_credentials: true
        key_in_query: false
        key_in_header: true
        principals:
          enabled: false
          error_on_miss: true
          directory: default
    - enabled: true
      instance_name: aaa-big-data-usage-replace-uri
      name: request-transformer
      config:
        replace:
          body: []
          uri: /usageManagement/v1/usage
          querystring: []
          headers: []
        rename:
          body: []
          headers: []
          querystring: []
        remove:
          body: []
          headers: []
          querystring: []
        append:
          body: []
          headers: []
          querystring: []
        http_method: null
        add:
          body: []
          headers: []
          querystring: []
  plugins:
  - enabled: false
    instance_name: aaa-bigdata-api-key-inject
    name: request-transformer
    config:
      replace:
        body: []
        uri: null
        querystring: []
        headers:
        - 'Api-Key: WZ0kawZDzgrDJLWEoCtRnPVIRkQTH1QOEKFLhVsbvrAX68ZEwl9bD0BvK815BV4MAgfmGaVTfx9LfYpCrqoYJIkvqVVs9aOCePaCig2T13dFybNtuH0jhAvFFZKMbriU'
      rename:
        body: []
        headers: []
        querystring: []
      remove:
        body: []
        headers: []
        querystring: []
      append:
        body: []
        headers: []
        querystring: []
      http_method: null
      add:
        body: []
        headers:
        - 'Api-Key: WZ0kawZDzgrDJLWEoCtRnPVIRkQTH1QOEKFLhVsbvrAX68ZEwl9bD0BvK815BV4MAgfmGaVTfx9LfYpCrqoYJIkvqVVs9aOCePaCig2T13dFybNtuH0jhAvFFZKMbriU'
        querystring: []
- write_timeout: 60000
  tags:
  - AAA
  connect_timeout: 60000
  read_timeout: 60000
  enabled: true
  retries: 5
  protocol: http
  name: aaa-rest-api
  port: 80
  host: aaa-rest-api.tst-ms.svc.cluster.local
  path: /
  routes:
  - response_buffering: true
    tags:
    - AAA
    paths:
    - /fbb/v1/radius
    path_handling: v0
    hosts:
    - api.tst.cz.oss-apigw.vodafone.com
    preserve_host: false
    name: aaa-rest-api-radius
    strip_path: true
    protocols:
    - https
    regex_priority: 0
    https_redirect_status_code: 426
    request_buffering: true
    plugins:
    - enabled: true
      instance_name: acl-aaa-rest-api-radius
      name: acl
      config:
        allow:
        - aaa
        always_use_authenticated_groups: false
        allow_when: null
        deny_when: null
        deny: null
        include_consumer_groups: true
        hide_groups_header: true
    - enabled: true
      instance_name: aaa-rest-api-basic-auth
      name: basic-auth
      config:
        realm: service
        anonymous: null
        brute_force_protection:
          redis:
            ssl_verify: true
            username: null
            host: null
            port: 6379
            server_name: null
            ssl: false
            timeout: 2000
            database: 0
            cloud_authentication: null
            password: null
          strategy: 'off'
        hide_credentials: true
        principals:
          enabled: false
          error_on_miss: true
          directory: default
    - enabled: false
      instance_name: Rest_API_Replace_URI
      name: request-transformer
      config:
        replace:
          body: []
          uri: /radius-api
          querystring: []
          headers: []
        rename:
          body: []
          headers: []
          querystring: []
        remove:
          body: []
          headers: []
          querystring: []
        append:
          body: []
          headers: []
          querystring: []
        http_method: null
        add:
          body: []
          headers: []
          querystring: []
    - enabled: true
      instance_name: aaa-rest-api-auth-error
      name: exit-transformer
      config:
        functions:
        - "return function(status, body, headers)\n  if status == 401 then\n    body\
          \ = '{\"status\":\"Error\",\"message\":\"Credentials rejected\"}'\n    headers[\"\
          Content-Type\"] = \"application/json\"\n    headers[\"Content-Length\"]\
          \ = nil\n  end\n  \n   if status == 403 then\n    body = '{\"status\":\"\
          Error\",\"message\":\"You are not authorized to execute this service\"}'\n\
          \    headers[\"Content-Type\"] = \"application/json\"\n    headers[\"Content-Length\"\
          ] = nil\n  end\n\n  return status, body, headers\nend"
        handle_unexpected: false
        handle_unknown: false
  - response_buffering: true
    tags:
    - AAA
    paths:
    - /cz/fbb/v1/radius
    path_handling: v0
    hosts:
    - api.tst.cz.oss-apigw.vodafone.com
    preserve_host: false
    name: ic-vci-aaa-rest-api-radius
    strip_path: true
    protocols:
    - https
    regex_priority: 0
    https_redirect_status_code: 426
    request_buffering: true
  plugins:
  - enabled: true
    instance_name: aaa-rest-api-basic-auth-inject
    name: request-transformer
    config:
      replace:
        body: []
        uri: null
        querystring: []
        headers:
        - 'Authorization: Basic aW50ZXJuYWw6aW50IzIwMjY='
      rename:
        body: []
        headers: []
        querystring: []
      remove:
        body: []
        headers: []
        querystring: []
      append:
        body: []
        headers: []
        querystring: []
      http_method: null
      add:
        body: []
        headers:
        - 'Authorization: Basic aW50ZXJuYWw6aW50IzIwMjY='
        querystring: []
